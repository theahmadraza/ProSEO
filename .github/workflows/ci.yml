name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast, dependency-free gate. Runs first so a leak fails the build in seconds.
  leak-guard:
    name: No private paths or client identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan tracked files for forbidden strings
        env:
          # Pipe-separated, case-insensitive extended regexes kept in a repository
          # secret, so this public file does not publish the names it protects.
          # Pull requests from forks receive no secrets and run the public
          # patterns only.
          PRIVATE_PATTERNS: ${{ secrets.LEAK_GUARD_PATTERNS }}
        run: |
          set -uo pipefail
          status=0
          scan() {
            local label="$1" pattern="$2" show="$3"
            if git grep -qIiE -- "$pattern" -- . ':(exclude).github/workflows/ci.yml'; then
              echo "::error::Forbidden ${label} found in tracked files"
              if [ "$show" = "content" ]; then
                git grep -nIiE -- "$pattern" -- . ':(exclude).github/workflows/ci.yml' || true
              else
                # Locations only: printing the matching line would publish the
                # private string in this public log.
                git grep -nIiE -- "$pattern" -- . ':(exclude).github/workflows/ci.yml' | cut -d: -f1,2 || true
              fi
              status=1
            fi
          }

          # Developer-machine home paths.
          scan "developer path" '/Users/[a-z]' content

          if [ -n "${PRIVATE_PATTERNS:-}" ]; then
            IFS='|' read -r -a private <<< "$PRIVATE_PATTERNS"
            for pattern in "${private[@]}"; do
              if [ -n "$pattern" ]; then
                scan "private identifier" "$pattern" locations
              fi
            done
          else
            echo "::notice::LEAK_GUARD_PATTERNS is not available; scanned public patterns only."
          fi

          if [ "$status" -eq 0 ]; then
            echo "Clean: none of the forbidden patterns are present."
          fi
          exit "$status"

  consistency:
    name: Reference graph and portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Consistency gate
        run: python3 scripts/consistency_check.py

      - name: Portability lint
        run: python3 scripts/portability_check.py

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 libcairo2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q
