[project]
name = "pro-seo"
version = "1.0.0"
description = "Comprehensive SEO analysis skill for Claude Code"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = [
  {name = "Ahmad Raza"}
]
keywords = ["seo", "claude-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/theahmadraza/ProSEO"
Repository = "https://github.com/theahmadraza/ProSEO"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
